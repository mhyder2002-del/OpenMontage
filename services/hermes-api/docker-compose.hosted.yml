# Self-contained stack for Hostinger Docker Manager (no build context / SSH).
# Pulls the gateway from the public GitHub tarball, then Caddy terminates TLS.

services:
  hermes-api:
    image: python:3.11-slim
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-hermestudios.com}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-lm-studio}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-}
      INFERENCE_BACKEND: ${INFERENCE_BACKEND:-}
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:-}
      INFERENCE_MODEL: ${INFERENCE_MODEL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_REQUIRE_AUTH: ${HERMES_REQUIRE_AUTH:-true}
      HERMES_MAX_INFLIGHT: ${HERMES_MAX_INFLIGHT:-32}
      HERMES_INFLIGHT_WAIT_SECONDS: ${HERMES_INFLIGHT_WAIT_SECONDS:-5}
      HERMES_FLYWHEEL_AUTO: ${HERMES_FLYWHEEL_AUTO:-false}
      HERMES_FLYWHEEL_SLEEP_SECONDS: ${HERMES_FLYWHEEL_SLEEP_SECONDS:-0.25}
      HERMES_FLYWHEEL_STORE: ${HERMES_FLYWHEEL_STORE:-/app/data/flywheel.json}
      HERMES_AGENTS_STORE: ${HERMES_AGENTS_STORE:-/app/data/agents.json}
      HERMES_AGENT_CONCURRENCY: ${HERMES_AGENT_CONCURRENCY:-3}
      HERMES_AGENT_INFER_TIMEOUT: ${HERMES_AGENT_INFER_TIMEOUT:-8}
      HERMES_CAMPAIGN_STORE: ${HERMES_CAMPAIGN_STORE:-/app/data/campaigns.json}
      HERMES_DB_PATH: ${HERMES_DB_PATH:-/app/data/hermes.db}
      # Empty by default. Profile postgres + DATABASE_URL=postgresql://hermes:hermes@postgres:5432/hermes
      # $0 extra on existing VPS 187.77.98.177 vs advertised intro ~$6.49/mo new KVM 1 (paid upfront).
      DATABASE_URL: ${DATABASE_URL:-}
      HERMES_RESEARCH_TIMEOUT: ${HERMES_RESEARCH_TIMEOUT:-4}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_CAMPAIGN_LAUNCH: ${STRIPE_PRICE_CAMPAIGN_LAUNCH:-}
      STRIPE_PRICE_CREDIT_PACK: ${STRIPE_PRICE_CREDIT_PACK:-}
      STRIPE_PRICE_AUTONOMOUS: ${STRIPE_PRICE_AUTONOMOUS:-}
      STRIPE_PRICE_INFERENCE_METER: ${STRIPE_PRICE_INFERENCE_METER:-}
      STRIPE_METER_EVENT_NAME: ${STRIPE_METER_EVENT_NAME:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
      HERMES_BILLING_STORE: ${HERMES_BILLING_STORE:-/app/data/billing.json}
      MONEYPRINTER_ENABLED: ${MONEYPRINTER_ENABLED:-false}
      MONEYPRINTER_BASE_URL: ${MONEYPRINTER_BASE_URL:-http://moneyprinter:8080}
      MONEYPRINTER_API_KEY: ${MONEYPRINTER_API_KEY:-}
      MONEYPRINTER_MODE: ${MONEYPRINTER_MODE:-http}
      MONEYPRINTER_LANGUAGE: ${MONEYPRINTER_LANGUAGE:-en-US}
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hermes_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/readyz', timeout=2)",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        apt-get update
        apt-get install -y --no-install-recommends curl ca-certificates
        rm -rf /var/lib/apt/lists/*
        curl -fsSL https://codeload.github.com/calesthio/OpenMontage/tar.gz/refs/heads/main -o /tmp/om.tgz
        mkdir -p /tmp/om /app /app/data
        tar -xzf /tmp/om.tgz -C /tmp/om --strip-components=1
        cp -a /tmp/om/services/hermes-api/. /app/
        cd /app
        pip install --no-cache-dir -r requirements.txt -r requirements.billing.txt -r requirements.postgres.txt
        exec uvicorn app:app --host 0.0.0.0 --port 8080

  # Optional. Not in the default stack. Do not start on 187.77.98.177 until cost OK
  # ($0 extra on that VPS vs ~$6.49/mo new KVM 1 paid upfront). Do not buy a KVM.
  # COMPOSE_PROFILES=postgres DATABASE_URL=postgresql://hermes:hermes@postgres:5432/hermes
  postgres:
    profiles: ["postgres"]
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hermes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermes}
      POSTGRES_DB: ${POSTGRES_DB:-hermes}
    volumes:
      - hermes_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:-ops@hermestudios.com}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      hermes-api:
        condition: service_healthy
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/caddy/Caddyfile <<'EOF'
        {
          email {$CADDY_EMAIL}
        }

        hermestudios.com, www.hermestudios.com {
          encode gzip
          reverse_proxy hermes-api:8080
        }

        hermestudios.org {
          encode gzip
          reverse_proxy hermes-api:8080
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

volumes:
  hermes_data:
  hermes_pg:
  caddy_data:
  caddy_config:
