name: Deploy Hermes API to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/hermes-api/**"
      - ".github/workflows/deploy-hostinger.yml"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build image (no push required)
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose
        run: |
          docker compose -f services/hermes-api/docker-compose.yml config >/dev/null
          COMPOSE_PROFILES=tls docker compose -f services/hermes-api/docker-compose.yml config >/dev/null
          COMPOSE_PROFILES=postgres docker compose -f services/hermes-api/docker-compose.yml config >/dev/null
          docker compose -f services/hermes-api/docker-compose.yml config | grep -q 'postgres:' && exit 1 || true
          COMPOSE_PROFILES=postgres docker compose -f services/hermes-api/docker-compose.yml config | grep -q 'postgres:'
      - id: meta
        run: echo "image_ref=ghcr.io/${{ github.repository_owner }}/hermes-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: services/hermes-api
          push: false
          tags: ${{ steps.meta.outputs.image_ref }}
          load: true

  deploy-ssh:
    name: SSH Docker compose
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.HOSTINGER_VM_ID != '' && vars.HERMES_DEPLOY_METHOD == 'ssh' }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose project
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.HOSTINGER_VPS_IP }}
          username: root
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          source: >-
            services/hermes-api/docker-compose.yml,
            services/hermes-api/docker-compose.hosted.yml,
            services/hermes-api/Dockerfile,
            services/hermes-api/Caddyfile,
            services/hermes-api/.dockerignore,
            services/hermes-api/requirements.txt,
            services/hermes-api/requirements.billing.txt,
            services/hermes-api/requirements.postgres.txt,
            services/hermes-api/app.py,
            services/hermes-api/billing.py,
            services/hermes-api/campaigns.py,
            services/hermes-api/flywheel.py,
            services/hermes-api/db.py,
            services/hermes-api/research.py,
            services/hermes-api/moneyprinter.py,
            services/hermes-api/walking_skeleton.py,
            services/hermes-api/agents/**,
            services/hermes-api/static/**
          target: /opt/hermes-api
          strip_components: 2
          timeout: 60s
      - name: Install Docker and start stack
        uses: appleboy/ssh-action@v1.2.2
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          CADDY_EMAIL: ${{ secrets.CADDY_EMAIL }}
        with:
          host: ${{ vars.HOSTINGER_VPS_IP }}
          username: root
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          envs: HERMES_API_KEY,CADDY_EMAIL
          command_timeout: 15m
          script: |
            set -eux
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sh
            fi
            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q "Status: active"; then
              ufw allow 22/tcp
              ufw allow 80/tcp
              ufw allow 443/tcp
            fi
            mkdir -p /opt/hermes-api
            umask 077
            cat > /opt/hermes-api/.env <<EOF
            PUBLIC_DOMAIN=hermestudios.com
            COMPOSE_PROFILES=tls
            CADDY_EMAIL=${CADDY_EMAIL:-ops@hermestudios.com}
            HERMES_API_KEY=${HERMES_API_KEY}
            HERMES_REQUIRE_AUTH=true
            HERMES_MAX_INFLIGHT=32
            HERMES_INFLIGHT_WAIT_SECONDS=5
            LM_STUDIO_BASE_URL=http://127.0.0.1:1234/v1
            EOF
            cd /opt/hermes-api
            COMPOSE_PROFILES=tls docker compose up -d --build
            docker compose ps
      - name: Probe public health
        run: |
          set -eux
          for i in $(seq 1 30); do
            if curl -fsS --max-time 8 https://hermestudios.com/livez; then
              break
            fi
            sleep 5
          done
          curl -fsS --max-time 15 https://hermestudios.com/health
          code=$(curl -sS --max-time 15 -o /tmp/chat.json -w '%{http_code}' \
            -X POST https://hermestudios.com/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"x","messages":[{"role":"user","content":"hi"}]}')
          echo "unauth_chat ${code}"
          test "${code}" = "401" -o "${code}" = "403" -o "${code}" = "503"

  deploy-hostinger:
    name: Hostinger Docker Manager
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.HOSTINGER_VM_ID != '' && vars.HERMES_DEPLOY_METHOD != 'ssh' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy on Hostinger VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: ${{ vars.HOSTINGER_VM_ID }}
          project-name: hermes-api
          docker-compose-path: services/hermes-api/docker-compose.yml
          environment-variables: |
            PUBLIC_DOMAIN=hermestudios.com
            COMPOSE_PROFILES=tls
            CADDY_EMAIL=${{ secrets.CADDY_EMAIL }}
            LM_STUDIO_BASE_URL=${{ secrets.LM_STUDIO_BASE_URL }}
            INFERENCE_BACKEND=${{ secrets.INFERENCE_BACKEND }}
            INFERENCE_BASE_URL=${{ secrets.INFERENCE_BASE_URL }}
            INFERENCE_API_KEY=${{ secrets.INFERENCE_API_KEY }}
            INFERENCE_MODEL=${{ secrets.INFERENCE_MODEL }}
            HERMES_API_KEY=${{ secrets.HERMES_API_KEY }}
            HERMES_REQUIRE_AUTH=true
            HERMES_MAX_INFLIGHT=${{ vars.HERMES_MAX_INFLIGHT }}
            HERMES_INFLIGHT_WAIT_SECONDS=5

  deploy-scaffold:
    name: Scaffold notes when Hostinger secrets are absent
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.HOSTINGER_VM_ID == '' }}
    steps:
      - name: Print setup checklist
        run: |
          echo "Hostinger deploy skipped — add GitHub secrets/vars:"
          echo "  secret HOSTINGER_API_KEY (hPanel → API)"
          echo "  variable HOSTINGER_VM_ID"
          echo "  secret HERMES_API_KEY"
          echo "  secret HOSTINGER_SSH_KEY (Ubuntu VPS without Docker Manager)"
          echo "  variable HOSTINGER_VPS_IP"
          echo "  variable HERMES_DEPLOY_METHOD=ssh"
          echo "  secret INFERENCE_BASE_URL (vLLM or hosted /v1; preferred)"
          echo "Production compose profile: COMPOSE_PROFILES=tls (Caddy 80/443)"
          echo "Do not purchase a VPS or plan from CI."
